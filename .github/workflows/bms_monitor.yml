name: 🎬 BMS + District Theatre Monitor — Avengers & Dune 3

on:
  schedule:
    - cron: "*/30 * * * *"   # Safety backup to ensure chain is never broken
  workflow_dispatch:          # Manual / self-chained runner
    inputs:
      test_alert:
        description: 'Send test notification to iPhone from Cloud'
        required: false
        type: boolean
        default: false

permissions:
  contents: write             # Needed to commit state file back
  actions: write              # Allows self-triggering next run to keep 24/7 continuous chain alive

jobs:
  check-theatres:
    name: Check BookMyShow + District for new theatres
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Check BookMyShow + District for new theatres (Active 40-Min Cloud Loop)
        env:
          NTFY_TOPIC:          ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER:         ${{ secrets.NTFY_SERVER }}
          SCRAPERAPI_KEY:         ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPERAPI_BACKUP_KEY:  ${{ secrets.SCRAPERAPI_BACKUP_KEY }}
          ZENROWS_KEY:         ${{ secrets.ZENROWS_KEY }}
          PROXY_URL:           ${{ secrets.PROXY_URL }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL:         ${{ secrets.WEBHOOK_URL }}
          NO_COLOR:            "1"       # Clean CI logs without ANSI codes
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python3 bms_theatre_monitor.py --test-alert --ntfy-topic "${NTFY_TOPIC:-}"
          else
            # Active 40-minute monitoring loop checking every 3 minutes (180s)
            python3 bms_theatre_monitor.py \
              --duration 2400 \
              --interval 180 \
              --state-file bms_theatres_state.json \
              --ntfy-topic  "${NTFY_TOPIC:-}" \
              --ntfy-server "${NTFY_SERVER:-https://ntfy.sh}"
          fi

      # Commit updated state only if it changed
      - name: Persist theatre state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bms_theatres_state.json
          if git diff --cached --quiet; then
            echo "No state change — nothing to commit."
          else
            git commit -m "chore: update theatre state [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          fi

      # Continuous 24/7 Relay: Dispatches the next runner to keep the cloud awake forever
      - name: Trigger next cloud runner in chain
        if: always() && inputs.test_alert != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Relaying to next cloud runner in chain..."
          gh workflow run bms_monitor.yml --ref main || true
